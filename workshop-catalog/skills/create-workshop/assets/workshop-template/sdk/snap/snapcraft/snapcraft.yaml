# Silicon Workshop — Snap Packaging SDK
# snapcraft.yaml, generated by the create-workshop skill from config/workshop.yaml.
#
# Config → snapcraft.yaml mapping:
#   ubuntu.core_base       -> build-base:   (a kernel snap has no `base:`)
#   toolchain.arch         -> architectures: (core20/core22) or platforms: (core24+)
#   kernel.config.value    -> kernel-ubuntu-kconfigflavour:
#   kernel flavour         -> name: linux-<flavour>
#
# Reference:
#   https://documentation.ubuntu.com/snapcraft/latest/reference/plugins/kernel_plugin/

name: linux-<vendor>-<soc>          # becomes linux-<kernel flavour>
version: "custom"
summary: Ubuntu kernel snap for <Vendor> <soc> (<evk-board>)
description: |
  Ubuntu Core kernel snap for the <Vendor> <soc> EVK (<evk-board>).
  Built from the Ubuntu kernel source tree using the Snapcraft Kernel plugin.

# A `type: kernel` snap is baseless: snapcraft needs `build-base`, not `base`.
build-base: <core-base>
grade: devel
confinement: strict
type: kernel

#@SNAP_ARCH_BLOCK@

parts:
  kernel:
    plugin: kernel
    # Relative to this file (sdk/snap/snapcraft/): the kernel tree cloned by
    # clone-kernel. A plain "." would point at this directory, not the kernel.
    source: ../../../kernel-src
    # Build via debian/rules (Ubuntu kernel packaging machinery).
    # Snapcraft handles both the .deb build and snap assembly in one run.
    kernel-ubuntu-debian-package: true
    # Ubuntu kernel flavour (debian/scripts/misc/annotations --flavour).
    kernel-ubuntu-kconfigflavour: <kernel-flavour>
