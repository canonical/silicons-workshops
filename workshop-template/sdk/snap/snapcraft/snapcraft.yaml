# snapcraft.yaml (TEMPLATE — generated by create-workshop skill)
#
# TEMPLATE: Replace all <placeholder> values before use.
# This file is generated by the create-workshop skill from config/workshop.yaml.
#
# Config → snapcraft.yaml mapping:
#   ubuntu.core_base       -> base:
#   toolchain.arch         -> platforms:
#   kernel.config.value    -> kernel-ubuntu-kconfigflavour:
#   silicon.vendor + soc   -> name:  (e.g. linux-mtk, linux-sa8775p)
#
# Reference:
#   https://documentation.ubuntu.com/snapcraft/latest/reference/plugins/kernel_plugin/

name: linux-<vendor>-<soc>          # TEMPLATE: e.g. linux-mtk, linux-sa8775p
version: "custom"
summary: Ubuntu kernel snap for <Vendor> <soc> (<evk-board>)
description: |
  Ubuntu Core kernel snap for the <Vendor> <soc> EVK (<evk-board>).
  Built from the Ubuntu kernel source tree using the Snapcraft Kernel plugin.

base: <core-base>                    # TEMPLATE: core24 | core26
grade: devel
confinement: strict
type: kernel

platforms:
  <toolchain-arch>:                  # TEMPLATE: arm64 | armhf

parts:
  kernel:
    plugin: kernel
    source: .
    # Build via debian/rules (Ubuntu kernel packaging machinery).
    # Snapcraft handles both the .deb build and snap assembly in one run.
    kernel-ubuntu-debian-package: true
    # Ubuntu kernel flavour (debian/scripts/misc/annotations --flavour).
    kernel-ubuntu-kconfigflavour: <kernel-flavour>  # TEMPLATE: e.g. mtk, generic
