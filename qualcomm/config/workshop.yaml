# Qualcomm Silicon Workshop — declarative project configuration
#
# This is the customization API for the workshop (SILICON_WORKSHOP_CONTRACT.md
# §2.4 / §4). It describes *what* to build. The SDK scripts under sdk/ define
# *how* it is built. A future BSP agent specializes this file, not the scripts.
#
# The checked-in defaults describe the reference Rubik Pi 3 (QCS6490) EVK and
# must build without any agent customization.
#
# IMPORTANT: no credentials or per-developer identity live here (contract §14).
# The reference kernel tree is a public https:// repo and needs no auth. For a
# private git+ssh:// repo, supply auth at runtime via the ssh-agent plug and set
# identity.launchpad_user below.

schema_version: 1

identity:
  # Only needed for private git+ssh:// Launchpad repos (see README §3).
  launchpad_user: ""

silicon:
  vendor: qualcomm
  # SoC family label. Qualcomm silicon is always ARM64.
  soc: qcs6490
  board: rubikpi3

ubuntu:
  release: noble        # 24.04 — must match the workshop variant you launch
  core_base: core24     # kernel snap base (core24 | core26)

kernel:
  # Public https:// example (Rubik Pi 3 linux-debian, already noble-based).
  repository: https://github.com/rubikpi-ai/linux-debian.git
  ref:
    type: commit        # branch | tag | commit
    value: 0f0155ba6d60 # -> 6.8.12-perf-g0f0155ba6d60
  config:
    # Native Ubuntu packaging flavour (debian/scripts/misc/annotations -l).
    type: flavour
    value: rubikpi
    # QUALCOMM EXTENSION (contract §4 vendor block): kconfig fragments merged on
    # top of the flavour via `annotations --update`. Order matters: the snapd
    # fragment first (board-agnostic Ubuntu Core baseline), customer delta last.
    fragments:
      - config/canonical-snapd.config
      - config/customer.config
    # QUALCOMM EXTENSION: kconfig symbols to force-disable (no CONFIG_ prefix).
    # CORESIGHT_DUMMY / CORESIGHT_TPDM break -Werror on this tree.
    disable:
      - CORESIGHT_DUMMY
      - CORESIGHT_TPDM
  # Device-tree output names under arch/arm64/boot/dts/qcom/ (no .dtb suffix).
  # Empty = stage all produced DTBs.
  device_trees:
    - qcs6490-thundercomm-rubikpi3

toolchain:
  arch: arm64           # Qualcomm is always arm64
  cross_compile: ""     # empty = auto-derive (aarch64-linux-gnu-)
